[package]
name = "llm-wiki-desktop"
version = "0.1.0"
description = "LLM Wiki Tauri desktop shell"
authors = ["LLM Wiki"]
edition = "2021"

[lib]
name = "llm_wiki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llm-wiki-core = { path = "../../../crates/llm-wiki-core" }
