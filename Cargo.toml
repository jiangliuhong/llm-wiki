[workspace]
resolver = "2"
members = [
  "crates/llm-wiki-core",
  "crates/llm-wiki-protocol",
  "crates/llm-wiki-mcp",
  "crates/llm-wiki",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
lazy_static = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
walkdir = "2"
